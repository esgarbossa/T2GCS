name: Exemplo Node.js
on:
  push:
    paths: ['examples/node-api/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['examples/node-api/**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: examples/node-api
      - run: docker build -t t2gcs-api ./examples/node-api
